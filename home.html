<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="./assets/css/main.css">
</head>
<body class="page-home">

    <header class="header header-superior">
        <div class="header-left">
            <span class="header-logo">NagaRL</span>

            <div class="header-lang">
                <button type="button" class="lang-btn" data-lang="es">esp</button>
                <span class="lang-sep">/</span>
                <button type="button" class="lang-btn" data-lang="en">eng</button>
            </div>
        </div>

        <nav class="header-nav">
            <a href="trabajos.html" data-i18n="nav_galeria">galería</a>
            <a href="sobremi.html" data-i18n="nav_sobremi">sobre-mí</a>
            <a href="home.html" class="active" data-i18n="nav_inicio">inicio</a>
        </nav>
    </header>

    <main class="home">
        <div class="home-caja">
            <video class="home-video" src="./assets/video/dibujo.mp4" autoplay loop muted playsinline></video>
            <h1 id="home-h1" class="home-bienvenida"></h1>
        </div>
    </main>

    <ul class="home-redes">
        <li><a href="https://www.instagram.com/pplulul/" target="_blank" data-i18n="home_redes_instagram">instagram</a></li>
        <li><a href="https://www.behance.net/pplulul" target="_blank" data-i18n="home_redes_behance">behance</a></li>
    </ul>

    <script src="./assets/js/gsap.min.js"></script>
    <script src="./assets/js/ScrambleTextPlugin.min.js"></script>
    <script src="./assets/js/TextPlugin.min.js"></script>
    <script src="./assets/js/transiciones.js"></script>
    <script src="./assets/js/efectos.js"></script>
    <script src="./assets/js/i18n.js"></script>
    <script>
        document.addEventListener("langchange", (e) => {
            const titulo = document.querySelector("#home-h1");
            window.escribirTexto(titulo, window.translations[e.detail.lang].home_titulo, 1.5);
        });
    </script>
</body>
</html>
